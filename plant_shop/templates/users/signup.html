{% extends "layouts/base.html" %}
{% block title %}Inscription{% endblock %}
{% block content %}
<div class="container mt-4" style="max-width: 500px;">
  <h1 class="mb-4 text-center">📝 Inscription</h1>
  <form method="post" class="border p-4 shadow-sm rounded bg-light">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success w-100">Créer un compte</button>
  </form>
  <div class="text-center mt-3">
    <a href="{% url 'login' %}" class="btn btn-outline-secondary">Déjà inscrit ? Se connecter</a>
  </div>
</div>
{% endblock %}
