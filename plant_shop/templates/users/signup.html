{% extends "layouts/base.html" %}
{% block title %}Inscription{% endblock %}
{% block content %}
<h1 class="mb-4">Inscription</h1>

<form method="post" class="card p-4 shadow">{% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn-green w-100 mt-3">S'inscrire</button>
</form>

<a href="{% url 'login' %}" class="btn btn-secondary mt-3">Déjà inscrit ? Se connecter</a>
{% endblock %}
