{% extends "layouts/base.html" %}
{% block title %}Nouvelle commande{% endblock %}
{% block content %}
<h1 class="text-center mb-4">📦 Valider ma commande</h1>

<div id="order-review-container" class="mb-4">
  <p class="alert alert-info">Chargement du panier...</p>
</div>

<form method="post" action="{% url 'order_create' %}">
  {% csrf_token %}
  <input type="hidden" id="order-items-input" name="items">
  <div class="text-end">
    <button class="btn btn-success" type="submit">Confirmer la commande</button>
  </div>
</form>
{% endblock %}

{% if request.GET.cleared %}
<script>
  Cart.clear();
</script>
{% endif %}
