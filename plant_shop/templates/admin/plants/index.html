{% extends "layouts/base.html" %}
{% block title %}Plantes Admin{% endblock %}
{% block content %}
<h1 class="mb-4">Plantes (Admin)</h1>

<div class="d-flex justify-content-between align-items-center mb-3">
  <a href="{% url 'admin_plants_new' %}" class="btn btn-outline-success">Nouvelle plante</a>
</div>

<table class="table table-striped table-bordered shadow-sm">
  <thead class="table-light">
    <tr>
      <th>Nom</th>
      <th>Prix</th>
      <th>Stock</th>
      <th colspan="2" class="text-center">Actions</th>
    </tr>
  </thead>
  <tbody>
    {% for plant in plants %}
    <tr>
      <td><a href="{% url 'plant_show' plant.id %}" class="text-decoration-none">{{ plant.name }}</a></td>
      <td>{{ plant.price }} €</td>
      <td>{{ plant.stock }}</td>
      <td class="text-center">
        <a href="{% url 'admin_plants_edit' plant.id %}" class="btn btn-sm btn-warning">Modifier</a>
      </td>
      <td class="text-center">
        <form method="post" action="{% url 'admin_plants_delete' plant.id %}" onsubmit="return confirm('Supprimer cette plante ?');">
          {% csrf_token %}
          <button class="btn btn-sm btn-danger">Supprimer</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
